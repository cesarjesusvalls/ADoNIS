# ADoNIS analysis: T2K CC0pi-Np from CCQE ONLY (carbon), ADoNIS vs ACHILLES -- apples-to-apples.
# ADoNIS side: QE bank ONLY (no RES-absorbed).  ACHILLES side: reference restricted to QE events
# (signal_process_id==200; 401/402 are RES).  Same T2K NUISANCE CC0pi selection (global highest-p
# proton must pass the window).  Needs the proc-tagged reference (extract_cc1pi_rich.py with `proc`).
# Run: python -u scripts/adonis_analyze.py configs/ana_cc0pi_resonly0pi_c6h.yaml
name: t2k_cc0pi_resonly0pi_c6h
inputs:
  adonis_res: [data/oracle/t2k_cc1pi_engine_rich_c6h.npz]
  reference:  [data/oracle/t2k_cc1pi_rich_ach_FSI_proc.npz]
signal:
  mu_win: [250.0, inf]
  cos_mu: -0.6
  p_win:  [450.0, 1000.0]
  cth: 0.4
  pi_win: null
  proton_lead: global
  pion_id: none
  proton_count: ge1
  require_proton: true
  target: carbon
  ref_proc: [401, 402]
observables:
  - {key: dpt,     label: "$\\delta p_T$ [MeV]",       linspace: [0, 800, 21]}
  - {key: dalphat, label: "$\\delta\\alpha_T$ [rad]",  linspace: [0, pi, 21]}
  - {key: Q2,      label: "$Q^2$ [GeV$^2$]",           linspace: [0, 1.4, 21]}
  - {key: W,       label: "vertex $W$ [MeV]",          linspace: [938, 1400, 21]}
  - {key: p_mu,    label: "$p_\\mu$ [MeV]",            linspace: [0, 2000, 21]}
  - {key: cos_mu,  label: "$\\cos\\theta_\\mu$",       linspace: [-0.6, 1.0, 21]}
  - {key: lp_p,    label: "lead $p_p$ [MeV]",          linspace: [450, 1000, 21]}
data: {enabled: false}
out_path: paper_figures/cc0pi_ENGINE_RESonly0pi_C6H.png
title: "T2K CC0$\\pi$-Np (12C)  RES-absorbed-only: ADoNIS QE vs ACHILLES QE (proc 401/402)"
ratio_ylim: [0.6, 1.4]
carbon_only: true
