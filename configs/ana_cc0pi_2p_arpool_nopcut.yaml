# CC0pi with EXACTLY 2 ejected protons (2p2h-like topology); leading proton std cuts.
# Run: python -u scripts/adonis_analyze.py configs/ana_cc0pi_2p.yaml
name: t2k_cc0pi_2p_pool
inputs:
  adonis_qe:  [data/oracle/t2k_cc0pi_engine_rich_arpool.npz]
  adonis_res: [data/oracle/t2k_cc1pi_engine_rich_ar.npz]
  reference:  [data/oracle/t2k_cc1pi_rich_ach_FSI_Ar.npz]
signal:
  mu_win: [250.0, inf]
  cos_mu: -0.6
  p_win:  [0.0, inf]
  cth: 0.4
  pi_win: null
  proton_lead: global
  pion_id: none
  require_proton: true
  n_ejected: 2
  eject_thresh: 0.0
  target: carbon
observables:
  - {key: dpt,     label: "$\\delta p_T$ [MeV]",       linspace: [0, 800, 16]}
  - {key: dalphat, label: "$\\delta\\alpha_T$ [rad]",  linspace: [0, pi, 13]}
  - {key: Q2,      label: "$Q^2$ [GeV$^2$]",           linspace: [0, 1.4, 16]}
  - {key: lp_p,    label: "lead $p_p$ [MeV]",          linspace: [0, 1500, 16]}
out_path: paper_figures/cc0pi_2proton_argon_POOL_nopcut.png
title: "CC0$\\pi$ 2 ejected protons (|p|>250); leading-proton std cuts [POOL]"
ratio_ylim: [0.4, 1.8]
carbon_only: true
