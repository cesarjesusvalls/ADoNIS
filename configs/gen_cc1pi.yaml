# ADoNIS generation: T2K CC1pi RES engine bank on carbon.
# Run: python -u scripts/adonis_generate.py configs/gen_cc1pi.yaml
# Cascade preset P=12/g6/nr4/mp6 = OVERNIGHT PRODUCTION (high fidelity). For fast dev/validation use
# the P=6/g3/nr2/mp4 preset (e.g. gen_p6g3.yaml). The P=12 here is intentional, not a bug.
name: t2k_cc1pi
material: C
n_per_seed: 30000
n_seeds: 56
channels: [res]            # -> data/oracle/t2k_cc1pi_engine_rich.npz
cascade: {P: 12, step: 0.04, max_steps: 260, nn_inelastic: true, mprot: 6}
tracking: {enabled: false, steps: false}
out_dir: data/oracle
tag: ""
