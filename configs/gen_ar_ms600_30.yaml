# Argon 30-seed IS-sampler run, max_steps=600 (Argon cascade reach) + per-species Pauli k_F fix.
# Same buffers as gen_ar_ms600.yaml, 6x the stats for the topology ratios. Overwrites _ar banks.
# Run: python -u scripts/adonis_generate.py configs/gen_ar_ms600_30.yaml
name: t2k_ar_ms600_30
material: Ar
n_per_seed: 30000
n_seeds: 30
channels: [qe, res]
cascade: {P: 6, max_gen: 3, n_recoil: 2, step: 0.04, max_steps: 600,
          cylinder: true, nn_inelastic: true, mprot: 4}
tracking: {enabled: false, steps: false}
out_dir: data/oracle
tag: _ar
