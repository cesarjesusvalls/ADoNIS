# Monochromatic e- beam (e,e') on 40Ar -- EM hard vertex, QE+RES.  The electron is a beam probe,
# so this sits with the other beams (beam_pip/prot/neut); probe=EM (hard vertex) vs hadron (pure FSI).
name: beam_e_Ar
probe: EM
beam: electron
material: Ar
channels: [qe, res]
e_beam: 2222.0
theta_acc: [14.0, 17.0]   # outgoing-e- polar acceptance [deg]: JLab (e,e) spectrometer window bracketing theta=15.541 (paper Fig 1)
fsi: true
# 250,000 events/chunk: the nuclear path sizes its FSI record from a calibration run, so the
# chunk is bounded by host memory, not by per-event slots.
n_per_seed: 250000
n_seeds: 2             # 500k by default; a shard scales with --n-seeds/--seed0, never --n-per-seed
seed0: 0
