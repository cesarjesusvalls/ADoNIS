name: nu_uBooNE_Ar
probe: CC
beam: spectrum
flux: microboone
material: Ar
channels: [qe, res]
fsi: true
# 125,000 events/chunk: this sample's cascade is active enough that the calibrated FSI record
# reaches ~19M slots at 250,000, which does not fit a 11 GB GPU.  Half the chunk halves the
# record and it does.
n_per_seed: 125000
n_seeds: 4             # 500k by default; a shard scales with --n-seeds/--seed0, never --n-per-seed
seed0: 0
