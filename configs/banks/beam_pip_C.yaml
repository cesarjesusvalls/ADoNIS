# Tagged pi+ beam (FSI-only cascade). piN->etaN' opens above |p|~680 MeV/c (reaches s_conv).
name: beam_pip_C
probe: hadron
beam: pip
material: C
pmin: 50.0
pmax: 1000.0
# 50,000 events/chunk: carbon's per-event FSI slots are (96, 256), a ~1.0 GB record that
# fits a GPU as well as a host.
n_per_seed: 50000
n_seeds: 10            # 500k by default; a shard scales with --n-seeds/--seed0, never --n-per-seed
seed0: 0
