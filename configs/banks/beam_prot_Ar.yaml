# Tagged proton beam on Ar (FSI-only cascade). NN->NDelta->NNpi opens above KE~290 MeV.
name: beam_prot_Ar
probe: hadron
beam: prot
material: Ar
pmin: 300.0
pmax: 1400.0
n_per_seed: 50000      # events/chunk (dense FSI buffers scale with this)
n_seeds: 10            # chunks -> 500k total by default (jobs override --n-seeds/--seed0 per shard)
seed0: 0
