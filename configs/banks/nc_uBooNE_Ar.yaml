# Neutral-current nu_mu on 40Ar in the BNB flux.
#
# Both channels are generated.  NC QE produces no pion at the vertex but still enters an NC1pi0
# selection, because the cascade can make the pion by charge exchange on the recoiling nucleon.
#
# There is no theta_acc: a polar acceptance on an invisible outgoing neutrino is meaningless, and
# GenConfig rejects one for probe NC rather than let it silently bias the sample.
name: nc_uBooNE_Ar
probe: NC
beam: spectrum
flux: microboone
material: Ar
channels: [qe, res]
achilles_coupl1_quirk: true      # match ACHILLES's NC coupling convention, so the two are comparable
fsi: true
