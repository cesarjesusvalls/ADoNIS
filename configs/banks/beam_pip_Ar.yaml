# Tagged pi+ beam on Ar (FSI-only cascade). piN->etaN' opens above |p|~680 MeV/c.
name: beam_pip_Ar
probe: hadron
beam: pip
material: Ar
pmin: 50.0
pmax: 1000.0
# 25,000 events/chunk: argon's per-event FSI slots scale by ceil(A/12), four times carbon's,
# so half the chunk holds the record to ~2.0 GB and it still fits a GPU.
n_per_seed: 25000
n_seeds: 20            # 500k by default; a shard scales with --n-seeds/--seed0, never --n-per-seed
seed0: 0
