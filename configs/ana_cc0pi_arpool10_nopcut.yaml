# S5 pool-vs-ACHILLES: identical to ana_cc0pi_ar_nopcut.yaml but adonis_qe -> the POOL-engine QE bank
# (t2k_cc0pi_engine_rich_arpool10.npz).  RES-absorbed stays the BFS bank (pool RES deferred), so the only
# change vs ana_cc0pi_ar_nopcut is the QE cascade engine -> the chi2/ratio delta isolates the pool.
# Run: python -u scripts/adonis_analyze.py configs/ana_cc0pi_arpool_nopcut.yaml
name: t2k_cc0pi_arpool_nopcut
inputs:
  adonis_qe:  [data/oracle/t2k_cc0pi_engine_rich_arpool10.npz]
  adonis_res: [data/oracle/t2k_cc1pi_engine_rich_ar.npz]
  reference:  [data/oracle/t2k_cc1pi_rich_ach_FSI_Ar.npz]
signal:
  mu_win: [250.0, inf]
  cos_mu: -0.6
  p_win:  [0.0, inf]
  cth: 0.4
  pi_win: null
  proton_lead: global
  pion_id: none
  proton_count: ge1
  require_proton: true
  target: carbon
observables:
  - {key: dpt,     label: "$\\delta p_T$ [MeV]",       linspace: [0, 800, 21]}
  - {key: dalphat, label: "$\\delta\\alpha_T$ [rad]",  linspace: [0, pi, 21]}
  - {key: Q2,      label: "$Q^2$ [GeV$^2$]",           linspace: [0, 1.4, 21]}
  - {key: W,       label: "vertex $W$ [MeV]",          linspace: [938, 1400, 21]}
  - {key: p_mu,    label: "$p_\\mu$ [MeV]",            linspace: [0, 2000, 21]}
  - {key: cos_mu,  label: "$\\cos\\theta_\\mu$",       linspace: [-0.6, 1.0, 21]}
  - {key: lp_p,    label: "lead $p_p$ [MeV]",          linspace: [0, 1500, 21]}
data: {enabled: false}
out_path: paper_figures/cc0pi_ENGINE_argon_POOLP10_nopcut.png
title: "T2K CC0$\\pi$-Np ($^{40}$Ar), POOL-engine QE + BFS RES-absorbed vs ACHILLES"
ratio_ylim: [0.6, 1.4]
carbon_only: false
