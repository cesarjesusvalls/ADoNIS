# Pool QE Ar bank with the stack width reduced P=16 -> P=6 (see what a smaller pool does to the result
# / overflow).  Otherwise identical to gen_ar_pool_qe.yaml.  Tagged _arpool6.
# Run: python -u scripts/adonis_generate.py configs/gen_ar_pool_qe_p6.yaml
name: t2k_ar_pool_qe_p6
material: Ar
n_per_seed: 30000
n_seeds: 5
channels: [qe]
cascade: {step: 0.04, max_steps: 600, nn_inelastic: true, mprot: 4}
tracking: {enabled: false, steps: false}
out_dir: data/oracle
tag: _arpool6
