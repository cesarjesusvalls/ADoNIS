# ADoNIS vs ACHILLES, T2K CC0pi-Np selection, on ARGON-40 (unphysical-on-purpose; same machinery as C).
# ADoNIS Ar engine banks vs ACHILLES Ar FSI reference. Run: python -u scripts/adonis_analyze.py configs/ana_cc0pi_ar.yaml
name: t2k_cc0pi_ar
inputs:
  adonis_qe:  [data/oracle/t2k_cc0pi_engine_rich_arhi.npz]
  adonis_res: [data/oracle/t2k_cc1pi_engine_rich_arhi.npz]
  reference:  [data/oracle/t2k_cc1pi_rich_ach_FSI_Ar.npz]
signal:
  mu_win: [250.0, inf]
  cos_mu: -0.6
  p_win:  [450.0, 1000.0]
  cth: 0.4
  pi_win: null
  proton_lead: global
  pion_id: none
  proton_count: ge1
  require_proton: true
  target: carbon   # = bound-nucleon selection (|p_struck|>1, true for ALL Ar events) + carbon TKI mass
                   # convention applied identically to ADoNIS-Ar and ACHILLES-Ar. Physical Ar residual
                   # masses are NOT threaded (M_A hardcoded 12C/11B in observables.py); the comparison
                   # stays internally consistent. ('argon' is not a valid target key -> would KeyError.)
observables:
  - {key: dpt,     label: "$\\delta p_T$ [MeV]",       linspace: [0, 800, 21]}
  - {key: dalphat, label: "$\\delta\\alpha_T$ [rad]",  linspace: [0, pi, 21]}
  - {key: Q2,      label: "$Q^2$ [GeV$^2$]",           linspace: [0, 1.4, 21]}
  - {key: W,       label: "vertex $W$ [MeV]",          linspace: [938, 1400, 21]}
  - {key: p_mu,    label: "$p_\\mu$ [MeV]",            linspace: [0, 2000, 21]}
  - {key: cos_mu,  label: "$\\cos\\theta_\\mu$",       linspace: [-0.6, 1.0, 21]}
  - {key: lp_p,    label: "lead $p_p$ [MeV]",          linspace: [450, 1000, 21]}
data: {enabled: false}
out_path: paper_figures/cc0pi_ENGINE_argon_hi.png
title: "T2K CC0$\\pi$-Np ($^{40}$Ar) ENGINE QE+RES-absorbed vs ACHILLES"
ratio_ylim: [0.6, 1.4]
carbon_only: false
