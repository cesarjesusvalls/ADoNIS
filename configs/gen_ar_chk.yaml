# 1-seed Ar sanity check at the enhanced buffers (P10/g4/nr6/mp10). Separate tag _archk so it does
# NOT touch the _ar banks. For inspecting proton-momentum sanity + cascade avalanche depth.
# Run: python -u scripts/adonis_generate.py configs/gen_ar_chk.yaml
name: t2k_ar_chk
material: Ar
n_per_seed: 30000
n_seeds: 1
channels: [qe]
cascade: {P: 10, step: 0.04, max_steps: 260, nn_inelastic: true, mprot: 10}
tracking: {enabled: false, steps: false}
out_dir: data/oracle
tag: _archk
