# Argon 5-seed run with the NEW flux importance sampler (BEAM_MODE='is' default) + dev buffers.
# 5 IS seeds ~ 75 flat seeds of effective QE stats. Overwrites _ar banks.
# Run: python -u scripts/adonis_generate.py configs/gen_ar5.yaml
name: t2k_ar5
material: Ar
n_per_seed: 30000
n_seeds: 5
channels: [qe, res]
cascade: {P: 6, max_gen: 3, n_recoil: 2, step: 0.04, max_steps: 260,
          nn_inelastic: true, mprot: 4}
tracking: {enabled: false, steps: false}
out_dir: data/oracle
tag: _ar
