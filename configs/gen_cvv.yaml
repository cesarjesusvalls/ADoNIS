# Carbon 20-seed P=6 validation -- SAME buffers as the Ar gen_arv validation, for an apples-to-apples
# 20-seed comparison with #2/#5/#8. Overwrites _cv banks. Run: python -u scripts/adonis_generate.py configs/gen_cvv.yaml
name: t2k_cvv
material: C
n_per_seed: 30000
n_seeds: 20
channels: [qe, res]
cascade: {step: 0.04, max_steps: 260, nn_inelastic: true, mprot: 4}
tracking: {enabled: false, steps: false}
out_dir: data/oracle
tag: _cv
