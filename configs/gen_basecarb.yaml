# Tiny carbon baseline (2 seeds, both channels) for the bit-exact refactor gate.
# Regenerated after each refactor stage and np-compared to prove carbon is unchanged.
# Run: python -u scripts/adonis_generate.py configs/gen_basecarb.yaml
name: t2k_basecarb
material: C
n_per_seed: 5000
n_seeds: 2
channels: [qe, res]
cascade: {P: 6, max_gen: 3, n_recoil: 2, step: 0.04, max_steps: 260,
          cylinder: true, nn_inelastic: true, mprot: 4}
tracking: {enabled: false, steps: false}
out_dir: data/oracle
tag: _basecarb
