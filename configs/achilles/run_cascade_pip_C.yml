# ACHILLES cascade pi+ on 12C reaction/absorption cross section (paper Fig 3 / c12_ar40_validation, left).
# achilles:cascade image, /achilles/bin/achilles-cascade, Mode: CrossSection.  KickMomentum is a range:
# the beam pion |p| is drawn uniform in [80,500] MeV per event (RunCascade.cc:250) and sigma(p) is
# extracted by binning the incoming |p| (analysis.oracle_tools.beam_sigma), not a per-point scan.  Only
# reacted events are written; GenCrossSection's 4th field = n_tried (uniform in p) gives the bin
# normalization.  radius=10 fm beam disk -> piR^2=3141.6 mb.  ACHILLES SIGSEGVs mid-run -> use --seeds N.
#   python -m analysis.oracle_tools.run_achilles configs/achilles/run_cascade_pip_C.yml --seeds 8
Initialize:
  seed: 123456789

Nucleus:
  Name: 12C
  Binding: 8.6
  Fermi Momentum: 225
  Density:
    ProtonFile: data/densities/c12.prova.txt
    NeutronFile: data/densities/c12.prova.txt
    FilePotential: data/realOP_12C_EDAI.dat
    Function: configuration
    Configs: data/configurations/QMC_configs.out.gz
  FermiGas:
    Type: Local
    Params: []
  Potential: 
    Name: Schroedinger
    r0: 0.16
    Mode: 3

Cascade:
  Mode: CrossSection
  # NucleonNucleon GiBUU/Decay + PionInteraction (MesonBaryon DCC hard scatter +
  # PionAbsorptionOneStep Oset) + ConstantInteraction (strange-baryon zeros).
  # hA_Rules.yml REQUIRES NucleonNucleon ResonanceMode:Decay when MesonBaryon/PionAbsorptionOneStep
  # are present -- the GeantInteraction set the image rejects.
  Interactions: !include "data/default/VirtResInteractions.yml"
  Step: 0.04
  Probability: Gaussian
  InMedium: None
  PotentialProp: False
  Algorithm: Base
  Params:
    radius: 10

KickMomentum: [80, 500]   # uniform-momentum beam; sigma(p) extracted by binning incoming |p| (RunCascade.cc:250)
NEvents: 200000
PID: 211

Output:
  Format: NuHepMC
  Name: /out/cascade_pip_C.hepmc
