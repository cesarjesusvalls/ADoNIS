# ACHILLES NEUTRAL-CURRENT nu_mu on 40Ar with the FULL cascade, BNB (MicroBooNE) flux -- the
# reference for the NC 1pi0 Xp comparison.
#
# Differs from run_MicroBooNE_Ar_fsi.yml in two lines, `Leptons: [14, [14]]` and the output name, so
# any NC/CC difference between the two references is the current and nothing else.  That is also why
# the HardCuts block below still cuts on a muon that an NC event does not contain: the block is inert
# (HardCuts is false and the range is the full [0,180]), and editing it would add a third difference.
Main:
  NEvents: 50000
  HardCuts: false
  EventCuts: false
  DoRotate: false
  RunDecays: False
  Output:
      Format: NuHepMC
      Name: /out/MicroBooNE_Ar_fsi_nc.hepmc
      Zipped: False

SherpaOptions: !include "data/default/SherpaOptions.yml"

Processes:
  - Leptons: [14, [14]]

Beams:
  - Beam:
      PID: 14
      Beam Params:
        Type: Spectrum
        Histogram: flux/microboone_numu.dat
Cascade:
  Run: True
  Interactions:
    - Name: NucleonNucleon
      Options:
        Mode: GiBUU
        ResonanceMode: Decay
        ExpSup: 0.0
    - Name: PionInteraction
      Options:
        HardScatter:
          Name: MesonBaryonInteraction
          Options:
        Absorption:
          Name: PionAbsorptionOneStep
          Options:
    - Name: ConstantInteraction
      Options:
        InitialStates:
          - Incoming: [22, 2112]
            Outgoing:
              - Outgoing: [22, 2112]
                CrossSection: 0
          - Incoming: [22, 2212]
            Outgoing:
              - Outgoing: [22, 2212]
                CrossSection: 0
          - Incoming: [3112, 2112]
            Outgoing:
              - Outgoing: [3112, 2112]
                CrossSection: 0
          - Incoming: [3112, 2212]
            Outgoing:
              - Outgoing: [3212, 2112]
                CrossSection: 0
          - Incoming: [321, 2212]
            Outgoing:
              - Outgoing: [321, 2212]
                CrossSection: 0
          - Incoming: [321, 2112]
            Outgoing:
              - Outgoing: [321, 2112]
                CrossSection: 0
          - Incoming: [3122, 2212]
            Outgoing:
              - Outgoing: [3122, 2212]
                CrossSection: 0
          - Incoming: [3122, 2112]
            Outgoing:
              - Outgoing: [3122, 2112]
                CrossSection: 0
          - Incoming: [3212, 2212]
            Outgoing:
              - Outgoing: [3212, 2212]
                CrossSection: 0
          - Incoming: [3212, 2112]
            Outgoing:
              - Outgoing: [3212, 2112]
                CrossSection: 0
          - Incoming: [3222, 2112]
            Outgoing:
              - Outgoing: [3222, 2112]
                CrossSection: 0
          - Incoming: [3222, 2212]
            Outgoing:
              - Outgoing: [3222, 2212]
                CrossSection: 0
          - Incoming: [311, 2112]
            Outgoing:
              - Outgoing: [311, 2112]
                CrossSection: 0
          - Incoming: [311, 2212]
            Outgoing:
              - Outgoing: [311, 2212]
                CrossSection: 0
  Step: 0.04
  Probability: Gaussian
  InMedium: None
  PotentialProp: False
  Algorithm: Base


NuclearModels:
 - NuclearModel:
    Model: FortranModel
    Name: QE_Spectral_Func
    ConfigFile: data/info_Ar40_pke.data
    FormFactorFile: "FormFactors.yml"
    Ward: None
 - NuclearModel:
    Model: FortranModel
    Name: RES_Spectral_Func
    ConfigFile: data/info_Ar40_pke.data
    FormFactorFile: "FormFactors.yml"
    Ward: None

Nuclei:
  - Nucleus: !include "data/default/40Ar.yml"

HardCuts:
  - Type: AngleTheta
    PIDs: 13
    range: [0., 180.]

Options: !include "data/default/OptionDefaults.yml"

Cache:
  Save: False
  Load: False

Backend:
  Name: Default
  Options: []
