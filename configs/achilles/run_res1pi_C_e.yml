# Single-pion-production (RES_Spectral_Func) ONLY reference config for the oracle.
# Run from the Achilles root:  ./build/bin/achilles <path>/res_1pi_12C.yml
Main:
  NEvents: 20000
  HardCuts: true
  EventCuts: false
  DoRotate: false
  RunDecays: False
  Output:
      Format: NuHepMC
      Name: /out/res1pi_C_e.hepmc
      Zipped: False

SherpaOptions: !include "data/default/SherpaOptions.yml"

Processes:
  - Leptons: [11, [11]]

Beams:
  - Beam:
      PID: 11
      Beam Params:
        Type: Monochromatic
        Energy: 1108

Cascade:
  Run: False
  Interactions: !include "data/default/VirtResInteractions.yml"
  Step: 0.04
  Probability: Gaussian
  InMedium: None
  PotentialProp: False
  Algorithm: Base

NuclearModels:
- NuclearModel:
   Model: FortranModel
   Name: RES_Spectral_Func
   ConfigFile: data/info_C12_pke.data
   FormFactorFile: "FormFactors.yml"
   Ward: None

Nuclei:
  - Nucleus: !include "data/default/12C.yml"

HardCuts:
  - Type: AngleTheta
    PIDs: 11
    range: [36.5, 38.5]

Options: !include "data/default/OptionDefaults.yml"

Backend:
  Name: Default
  Options: []
