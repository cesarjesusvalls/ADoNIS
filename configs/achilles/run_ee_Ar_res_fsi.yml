# ACHILLES inclusive (e,e') -- RES_Spectral_Func on 40Ar, e- beam E=2.222 GeV, theta_e in [5,45] deg
# (narrow acceptance ~15.541 deg).  The RES (pion-production) component of paper Fig. inclusive_data (JLab Murphy:2019wed).
# Run in the achilles:oracle image (Cascade OFF -> inclusive):
#   python -m analysis.oracle_tools.run_achilles configs/achilles/run_ee_Ar_res_fsi.yml
Main:
  NEvents: 40000
  HardCuts: true
  EventCuts: false
  DoRotate: false
  RunDecays: False
  Output:
      Format: NuHepMC
      Name: /out/ee_Ar_res_fsi.hepmc
      Zipped: False

SherpaOptions: !include "data/default/SherpaOptions.yml"

Processes:
  - Leptons: [11, [11]]

Beams:
  - Beam:
      PID: 11
      Beam Params:
        Type: Monochromatic
        Energy: 2222

Cascade:
  Run: True
  Interactions:
    - Name: NucleonNucleon
      Options:
        Mode: GiBUU
        ResonanceMode: Decay
        ExpSup: 0.0
    - Name: PionInteraction
      Options:
        HardScatter:
          Name: MesonBaryonInteraction
          Options:
        Absorption:
          Name: PionAbsorptionOneStep
          Options:
    - Name: ConstantInteraction
      Options:
        InitialStates:
          - Incoming: [22, 2112]
            Outgoing:
              - Outgoing: [22, 2112]
                CrossSection: 0
          - Incoming: [22, 2212]
            Outgoing:
              - Outgoing: [22, 2212]
                CrossSection: 0
          - Incoming: [3112, 2112]
            Outgoing:
              - Outgoing: [3112, 2112]
                CrossSection: 0
          - Incoming: [3112, 2212]
            Outgoing:
              - Outgoing: [3212, 2112]
                CrossSection: 0
          - Incoming: [321, 2212]
            Outgoing:
              - Outgoing: [321, 2212]
                CrossSection: 0
          - Incoming: [321, 2112]
            Outgoing:
              - Outgoing: [321, 2112]
                CrossSection: 0
          - Incoming: [3122, 2212]
            Outgoing:
              - Outgoing: [3122, 2212]
                CrossSection: 0
          - Incoming: [3122, 2112]
            Outgoing:
              - Outgoing: [3122, 2112]
                CrossSection: 0
          - Incoming: [3212, 2212]
            Outgoing:
              - Outgoing: [3212, 2212]
                CrossSection: 0
          - Incoming: [3212, 2112]
            Outgoing:
              - Outgoing: [3212, 2112]
                CrossSection: 0
          - Incoming: [3222, 2112]
            Outgoing:
              - Outgoing: [3222, 2112]
                CrossSection: 0
          - Incoming: [3222, 2212]
            Outgoing:
              - Outgoing: [3222, 2212]
                CrossSection: 0
          - Incoming: [311, 2112]
            Outgoing:
              - Outgoing: [311, 2112]
                CrossSection: 0
          - Incoming: [311, 2212]
            Outgoing:
              - Outgoing: [311, 2212]
                CrossSection: 0
  Step: 0.04
  Probability: Gaussian
  InMedium: None
  PotentialProp: False
  Algorithm: Base


NuclearModels:
- NuclearModel:
   Model: FortranModel
   Name: RES_Spectral_Func
   ConfigFile: data/info_Ar40_pke.data
   FormFactorFile: "FormFactors.yml"
   Ward: None

Nuclei:
  - Nucleus: !include "data/default/40Ar.yml"

HardCuts:
  - Type: AngleTheta
    PIDs: 11
    range: [14.0, 17.0]

Options: !include "data/default/OptionDefaults.yml"

Backend:
  Name: Default
  Options: []
