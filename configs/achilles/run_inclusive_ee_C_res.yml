# ACHILLES inclusive (e,e') -- RES_Spectral_Func on 12C, e- beam E=2.222 GeV, theta_e in [5,45] deg
# (narrow acceptance ~15.541 deg).  The RES (pion-production) component of paper Fig. inclusive_data (JLab Murphy:2019wed).
# Run in the achilles:oracle image (Cascade OFF -> inclusive):
#   python -m analysis.oracle_tools.run_achilles configs/achilles/run_inclusive_ee_C_res.yml
Main:
  NEvents: 40000
  HardCuts: true
  EventCuts: false
  DoRotate: false
  RunDecays: False
  Output:
      Format: NuHepMC
      Name: /out/inclusive_ee_C_res.hepmc
      Zipped: False

SherpaOptions: !include "data/default/SherpaOptions.yml"

Processes:
  - Leptons: [11, [11]]

Beams:
  - Beam:
      PID: 11
      Beam Params:
        Type: Monochromatic
        Energy: 2222

Cascade:
  Run: False
  Interactions: !include "data/default/VirtResInteractions.yml"
  Step: 0.04
  Probability: Gaussian
  InMedium: None
  PotentialProp: False
  Algorithm: Base

NuclearModels:
- NuclearModel:
   Model: FortranModel
   Name: RES_Spectral_Func
   ConfigFile: data/info_C12_pke.data
   FormFactorFile: "FormFactors.yml"
   Ward: None

Nuclei:
  - Nucleus: !include "data/default/12C.yml"

HardCuts:
  - Type: AngleTheta
    PIDs: 11
    range: [14.0, 17.0]

Options: !include "data/default/OptionDefaults.yml"

Backend:
  Name: Default
  Options: []
