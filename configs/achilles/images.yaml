# The ACHILLES images the comparison runs against, pinned by digest.
#
# A tag can be moved; a digest cannot, so a reproduction that names one of these is running the exact
# generator the paper used.  cascade and fullcascade are built by .github/workflows/images.yml from
# upstream ACHILLES at the commit below, with one build-time change: the standalone achilles-cascade
# target does not link the interaction library, so its self-registering interactions are absent and
# the driver aborts on the first lookup.  The recipes in docker/ add that link.
registry: ghcr.io/cesarjesusvalls/achilles

source:
  repository: AchillesGen/Achilles
  commit: 91b5ea5adfe13a83a30b6365664053af11414dbc

digests:
  oracle:      sha256:0c36e0d80f7afd20cab742b2f7c74134304253b4bf28cbf954e4cf0ef61dc697
  cascade:     sha256:1a8102cbedd239f4aaf14af1367ea6d274d57eb3b76b28d011bb2a0611f275a2
  fullcascade: sha256:efe95c75d3aa1c0ee6709b644c4a0d34044e7b3e8fff017e4797b6c201a30685
