# Argon QE CC0pi bank generated with the POOLED cascade engine (single per-step-reconciled stack,
# ~2.8x faster than BFS), to validate the pool vs ACHILLES (S5).  QE only (the pool's RES integration
# is deferred).  M=16 stack (concurrent occupancy 99%<=5, max ~10 + all created pions; overflow ~0).
# max_steps floor 600 -> generate.py auto-raises to the Argon-sized 683 (nucleus-aware).  Tagged
# _arpool so it never overwrites the committed BFS _ar bank.
# Run: python -u scripts/adonis_generate.py configs/gen_ar_pool_qe.yaml
name: t2k_ar_pool_qe
material: Ar
n_per_seed: 30000
n_seeds: 5
channels: [qe]
cascade: {step: 0.04, max_steps: 600, nn_inelastic: true, mprot: 4}
tracking: {enabled: false, steps: false}
out_dir: data/oracle
tag: _arpool
