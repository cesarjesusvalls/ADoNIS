# Template-fit unfolding of the T2K CC0pi double-differential cross section in muon momentum and
# angle, with flux, detector and cross-section nuisance parameters floated simultaneously.

name: t2k_cc0pi

# The topological CC0pi signal -- any number of protons, no angular cut -- not the CC0pi-Np TKI signal
# of t2k_cc0pi.yaml, which additionally requires a leading proton in 450-1000 MeV/c.
sample: t2k_cc0pi_ddxs

# The assumed data exposure, not the MC size: weights are normalised so the total pre-selection rate
# is this.  The bank is much larger, so the response is not statistics-limited.
norm_events: 200000

detector:
  sigma_p: 0.10
  sigma_theta_deg: 5.0
  # Charged pions below pi_eff_p_max are reconstructed with efficiency pi_eff.  This is what creates
  # the background: a missed pion turns a true CC1pi event into a reconstructed CC0pi one.  With
  # perfect PID the truth and reco selections coincide event for event, and the cross-section
  # parameters -- which reweight only the background -- would have nothing to act on.
  pi_eff_p_max: 400.0
  pi_eff: 0.5

binning:
  # The published T2K staircase: 58 truth bins over 9 cos theta_mu slices, with p_mu binned
  # conditionally on the slice.  A rectangular grid built from marginal quantiles empties its corners,
  # which makes those templates identically zero and the fit singular.
  observables: lep
  reco_split: 2               # -> 116 reconstructed bins; the templates carry no prior, so 58 v 58
                              #    would leave no margin

flux:
  sigma: 0.10
  corr_length: 400.0          # MeV, in the exponential correlation kernel between flux bins

priors:
  detector: 0.05
  # An L2 over the reconstructed bins of each parameter's effect on the background, in units of the
  # Poisson error.  Parameters above the threshold are floated.
  dial_threshold: 1.0

studies:
  - {name: asimov}                            # closure: every template must return 1
  - {name: sig120,   scale_c: 1.20}           # the templates must find it and nothing else may move
  - {name: flux120,  scale_flux_peak: 1.20}   # separability: the flux also scales the signal
  - {name: fluxtilt, flux_tilt: 0.15}
  - {name: combo,    scale_c: 1.15, flux_tilt: 0.15}

# Nested, not stacked: each entry is the uncertainty with that block and every block before it
# enabled, so the increment is what a block costs in the presence of the others.
budget: [stat, xsec, flux, det]

# Stamped into the npz so the figures stay pure consumers of it.
figures:
  slices: [[0.20, 0.60], [0.94, 0.98]]
  aspect: 0.5
