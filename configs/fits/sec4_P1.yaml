# The closure fit and its four uncertainty constructions, at twice the resident statistics
# of sec4_P2 and the tighter sparse-bin cut that goes with them.

name: sec4_P1

samples: [t2k_cc0pi, t2k_cc1pi_ch, minerva_stv, minerva_ptpz, ee_omega,
          minerva_cc1pip_tpi, minerva_cc1pip_q2]
beams:   [pip, prot, neut]

# How many events are resident, which sets the MC error per bin and so the sparse-bin mask.
banks:
  sig_cap:      250000
  nu_chunks:    120
  e_chunks:     40
  beam_chunks:  10

data:
  mode: closure               # Asimov: data is the exact nonlinear reweight at `inject`, no noise
  inject:                     # the truth the fit has to recover, starting blind from nominal
    M_A_qe: 1.12
    M_A_res: 0.85
    axial_strength: 1.1
    res_axial_strength: 0.8
    delta_strength: 0.9
    sabs: 1.18
    s_piN_elastic: 0.88
    s_conv: 1.15
    s_NN_elastic: [0.82, 1.25, 0.9]        # pp, pn, nn
    s_NN_inelastic: {0: 1.2, 2: 0.86}      # pn left at nominal
    f_NN_cex: 0.4
    kF_sf: 1.1
    Eb_shift: 0.5
    src_tail: 0.92
  sigma:
    syst: 0.05                # sigma is 5% of the nominal central value
    mc_term: false            # the MC error is not added to it in quadrature
    mask_mcfrac: 0.05         # drop bins whose MC error exceeds this fraction of central
    freeze_at: nominal        # sigma and the mask are fixed at nominal, not recomputed per toy

fit:
  dials: constrained                # the parameters with sigma_post/sigma_prior < 0.5 on the Fisher: 17
  estimator: mle              # no parameter priors; the physical ranges still apply
  minimizer:
    method: trf
    max_nfev: 200
    gtol: 1.0e-8
    xtol: 1.0e-14
    ftol: 1.0e-14
    x_scale: jac
    start: nominal

uncertainty:
  - method: gaussian          # (J^T W J)^-1 at the best fit

  - method: profile           # 1-D, per parameter
    n: 13
    reach: adaptive           # extend each side until dchi2 > 25 or a physical boundary
    max_nfev: 60
    stores: [prof_dobj, grids_sigma, logdet_Vnuis]

  - method: profile2d
    dials: [M_A_res, delta_strength, res_axial_strength, Eb_shift]
    n: 41
    axes_from: profile        # the same domain as the 1-D scan
    max_nfev: 8               # warm-started along a snake path, so few steps per node
    stores: [chi2_abs, logdet_Vnuis]

  - method: gradient2d
    range: 3.0                # read by the shared grid walk; unused when axes are physical
    dials: [M_A_res, delta_strength, res_axial_strength, Eb_shift]
    n: 25
    axes: physical            # each parameter's full allowed range, not a sigma window
    jacobian: per_node        # recomputed at every node, not frozen at the best fit

  - method: nuts
    chains: 16
    samples: 1500
    warmup: 150
    max_depth: 8
    mass_matrix: fit_V        # the closure covariance, in sigma_post units
    truncate: physical_box    # -inf outside the physical ranges

  - method: toys
    n: 2000
    shard_size: 50            # --shard k/40
    fixed_truth: true         # a statistics-only ensemble around `inject`
    seed: {base: 0, stride: 50, formula: "default_rng(1_000_000 + seed)"}
    noise: per_bin_gaussian   # at the fit's own sigma
