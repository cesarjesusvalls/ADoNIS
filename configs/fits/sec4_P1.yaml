# Section 4, study point P1 -- the closure + uncertainty campaign behind figures A-D.
#
# THIS FILE IS NOT YET READ BY ANY CODE.  It is a faithful transcription of the environment the P1 jobs
# actually ran with, recovered from the SLURM submitters in the session scratchpad, which is the only
# place those parameters existed.  It is committed now so the run is reproducible before the loader
# exists (P0.3 of docs/consolidation_plan.md); P2 makes `python -m adonis.fit` consume it, and the
# acceptance test for that work is that it reproduces sec4_P1.npz bit-for-bit.
#
# Every value below is transcribed, not chosen.  Where the jobs disagreed with each other the
# discrepancy is called out rather than silently resolved -- those disagreements were bugs.

name: sec4_P1

# ---- what is fitted ------------------------------------------------------------------------------ #
samples: [t2k_cc0pi, t2k_cc1pi_ch, minerva_stv, minerva_ptpz, ee_omega,
          minerva_cc1pip_tpi, minerva_cc1pip_q2]     # configs/samples/*.yaml
beams:   [pip, prot, neut]                            # 15 bins each, 2 observables each (BEAM_OBS)

# bank chunk caps -- these set how many events are resident, and hence the MC error per bin, so they
# are part of the physics definition and not a performance knob
banks:
  sig_cap:      250000        # S4_SIG_CAP     events kept per sample
  nu_chunks:    120           # S4_NU_CHUNKS
  e_chunks:     40            # S4_E_CHUNKS
  beam_chunks:  10            # S4_BEAM_CHUNKS

# ---- the data ------------------------------------------------------------------------------------ #
data:
  mode: closure               # Asimov: data = exact nonlinear reweight at `inject`, no noise
  # PHYSFIT_INJECT.  37 sigma from nominal across the 17 dials -- deliberately far, so the fit is blind.
  inject:
    M_A_qe: 1.12
    M_A_res: 0.85
    axial_strength: 1.1
    res_axial_strength: 0.8
    delta_strength: 0.9
    sabs: 1.18
    s_piN_elastic: 0.88
    s_conv: 1.15
    s_NN_elastic: [0.82, 1.25, 0.9]        # [0],[1],[2]
    s_NN_inelastic: {0: 1.2, 2: 0.86}      # [1] left at nominal
    f_NN_cex: 0.4
    kF_sf: 1.1
    Eb_shift: 0.5
    src_tail: 0.92
  sigma:
    syst: 0.05                # sigma = 5% of the NOMINAL central value
    mc_term: false            # S4_SIGMA_SYST_ONLY=1 -- the MC error is NOT added in quadrature
    mask_mcfrac: 0.05         # S4_MIN_MCFRAC -- drop bins whose MC error exceeds 5% of central
    freeze_at: nominal        # sigma and the mask are frozen at nominal, not recomputed per toy
    # 282 of 325 bins survive.  mcerr is used ONLY for the mask; it never enters sigma.

# ---- the fit ------------------------------------------------------------------------------------- #
fit:
  dials: gate1                # shrink < 0.5 on the Gate-I Fisher -> 17 dials
  estimator: mle              # S4_PRIOR_SCALE=0.0 -> prior widened by 1e6
  minimizer:
    method: trf               # S4_FITTER / S4_PROF_FITTER = trf
    max_nfev: 200             # ALTGEN_NIT=200 -> max(nit, 8)
    gtol: 1.0e-8              # S4_TRF_GTOL; xtol/ftol stay tight on purpose
    xtol: 1.0e-14
    ftol: 1.0e-14
    x_scale: jac
    start: nominal            # blind: the fit starts at nominal, 37 sigma from the truth

# ---- uncertainty ---------------------------------------------------------------------------------- #
uncertainty:
  - method: gaussian          # (J^T W J)^-1 at the best fit; falls out of the fit

  - method: profile           # 1-D, per dial
    n: 13                     # S4_PROF_N per shard x 17 shards
    reach: adaptive           # per-dial span; bounded dials scanned FROM the wall upward
    max_nfev: 60              # ALTGEN_NIT=60 for the profile jobs -- NOTE: differs from the fit's 200
    stores: [prof_dobj, grids_sigma, logdet_Vnuis]

  - method: profile2d         # figure B
    dials: [M_A_res, delta_strength, res_axial_strength, Eb_shift]
    n: 41
    axes_from: profile        # S4_CORNER_FROM_PROFILE=1 -- same domain as the 1-D scan
    max_nfev: 8               # ALTGEN_NIT=3 -> max(nit, 8); warm-started along a snake path
    stores: [chi2_abs, logdet_Vnuis]

  - method: gradient2d        # figure C
    dials: [M_A_res, delta_strength, res_axial_strength, Eb_shift]
    n: 25
    axes: physical            # each dial's FULL allowed range, not a sigma window
    jacobian: per_node        # recomputed at every node, not frozen at the BFP

  - method: nuts              # figure B / A; adonis.fit.nuts
    chains: 16
    samples: 1500             # 24,000 total
    warmup: 150
    max_depth: 8
    mass_matrix: fit_V        # from the closure covariance, in sigma_post units
    truncate: physical_box    # -inf outside; ~200-270 rejections per chain

  - method: toys              # figure A panel (b)
    n: 2000
    fixed_truth: true         # S4_FIXED_TRUTH == inject: statistics-only ensemble
    seed: {base: 0, stride: 50, formula: "default_rng(1_000_000 + seed)"}
    noise: per_bin_gaussian   # at the fit's own sigma

# ---- known discrepancies in the run as executed --------------------------------------------------- #
# Recorded because a future reproduction will otherwise "fix" them and not match:
#   * the profile jobs ran ALTGEN_NIT=60 while the closure and toys ran 200.  Both converge (median
#     Newton decrement 4e-5) so it does not change the result, but it is not intentional design.
#   * the 2-D corner was originally run WITHOUT S4_PRIOR_SCALE (so MAP, not MLE) and with lm_fit
#     instead of trf.  Both were fixed and the scan re-run; the committed shards are the corrected ones.
#   * the toy shards for bases 500-950 were written as sec4_P1ens_* (missing underscore) and renamed to
#     sec4_P1_ens_*.  A glob on the old name silently found only 1500 of the 2000 toys.
