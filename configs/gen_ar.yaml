# ADoNIS Argon-40 full-stats generation (T2K flux, unphysical-on-purpose: see same plots on Ar).
# Slightly-bumped cascade (P=8/g4/nr3/mp6) for the all-species + consumed-depletion engine -- enough
# headroom to clear the P=6 overflow without going to the heavy P=12. Writes t2k_cc{0,1}pi_engine_rich_ar.npz.
# Run: python -u scripts/adonis_generate.py configs/gen_ar.yaml
name: t2k_ar
material: Ar
n_per_seed: 30000
n_seeds: 50
channels: [qe, res]
cascade: {P: 8, step: 0.04, max_steps: 260, nn_inelastic: true, mprot: 6}
tracking: {enabled: false, steps: false}
out_dir: data/oracle
tag: _ar
