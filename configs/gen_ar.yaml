# ADoNIS Argon-40 full-stats generation (T2K flux, unphysical-on-purpose: see same plots on Ar).
# NOMINAL P=6 cascade (= the validated t2k blueprint config). Writes t2k_cc{0,1}pi_engine_rich_ar.npz.
# Run: python -u scripts/adonis_generate.py configs/gen_ar.yaml
name: t2k_ar
material: Ar
n_per_seed: 30000
n_seeds: 20
channels: [qe, res]
cascade: {P: 6, max_gen: 3, n_recoil: 2, step: 0.04, max_steps: 260,
          cylinder: true, nn_inelastic: true, mprot: 4}
tracking: {enabled: false, steps: false}
out_dir: data/oracle
tag: _ar
