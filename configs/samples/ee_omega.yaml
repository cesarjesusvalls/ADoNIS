# Inclusive (e,e') energy-transfer spectrum on 12C @ 2.222 GeV (JLab E12-14-012), EM probe.
# One inclusive omega observable, QE+RES summed as a measurement reports it.  The scattered-electron
# theta window is the only cut; the generation acceptance is already in the bank.  omega edges are in
# MeV, the bank's units; the figure plots the same spectrum on a GeV axis.
render: multiobs
name: ee_omega
probe: electron
inputs:
  adonis_bank: [beam_e_C/merged]
  reference:   [output/achilles/fsrich/inclusive_ee_C_qe.npz, output/achilles/fsrich/inclusive_ee_C_res.npz]
signal:
  beam_energy: 2222.0         # MeV
  e_theta_win: [14.0, 17.0]   # deg (theta_e' ~ 15.5)
observables:
  - {key: omega, label: '$\omega$ [MeV]', linspace: [50.0, 950.0, 46]}
out_path: output/paper/fig01_ee_omega.png
title: "Inclusive (e,e') at 2.222 GeV"
ratio_band: [0.9, 1.1]
ratio_ylim: [0.6, 1.4]
