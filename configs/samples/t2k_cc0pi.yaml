# T2K CC0pi-Np TKI on 12C (arXiv:1802.05078 signal).  One definition, three consumers: the validation
# figure, the Jacobian, and the fit.  The render/out_path/ratio keys are plot hints; the config loader
# ignores what it does not own.
render: multiobs
name: t2k_cc0pi
inputs:
  adonis_bank: [output/paper_banks_p4/nu_T2K_C/merged]
  reference:   [output/achilles/fsrich/nu_T2K_C.npz]
signal:      # CC0pi: mu 250-inf & cos>-0.6 ; global leading p 450-1000 & cos>0.4 ; zero mesons
  mu_win: [250.0, inf]
  cos_mu: -0.6
  p_win: [450.0, 1000.0]
  cth: 0.4
  pi_win: null
  pion_id: none
  proton_lead: global
observables:
  # dpt, dalphat: exact NUISANCE T2K_CC0pi STV release edges (T2K:2018rnz / 1802.05078).  pmu/cos_mu are
  # ADoNIS validation extras (not in the release).
  - {key: dpt,     label: '$\delta p_T$ [MeV/c]',    edges: [0, 80, 120, 155, 200, 260, 360, 510, 1100]}
  - {key: dalphat, label: '$\delta\alpha_T$ [rad]',  edges: [0.0, 0.47, 1.02, 1.54, 1.98, 2.34, 2.64, 2.89, pi]}
  - {key: pmu,     label: '$p_\mu$ [MeV/c]',         linspace: [0.0, 2000.0, 21]}
  - {key: cos_mu,  label: '$\cos\theta_\mu$',        linspace: [-0.6, 1.0, 21]}
out_path: output/paper/fig07_t2k_cc0pi.png
title: 'T2K CC0$\pi$ TKI on $^{12}$C'
ratio_band: [0.9, 1.1]
ratio_ylim: [0.75, 1.25]
