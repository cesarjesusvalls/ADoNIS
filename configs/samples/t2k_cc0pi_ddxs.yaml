# T2K CC0pi DOUBLE-DIFFERENTIAL d^2sigma/dp_mu dcos(theta_mu) signal (T2K:2020sbd, arXiv:2002.09323).
#
# A different measurement from configs/samples/t2k_cc0pi.yaml, which is the CC0pi-Np TKI signal of
# arXiv:1802.05078.  The two share a name but not a signal definition, and running either with the
# other's binning gives a plausible-looking wrong answer.  This one is:
#
#   proton      topological -- any number of protons, including none.
#   muon angle  no cut; the binning covers cos_mu down to -1.
#   muon p      no lower cut; the published binning starts at p_mu = 0.
#   mesons      no pions and no other mesons (eta, K, ...).
#   target      CH, not pure carbon.  Free hydrogen has no neutrons and so contributes essentially
#               nothing to nu_mu CC0pi; what it changes is the per-nucleon divisor, 13 against 12.
#
# The bank is the same carbon bank; only the selection differs.
render: multiobs
name: t2k_cc0pi_ddxs
inputs:
  adonis_bank: [output/paper_banks_p4/nu_T2K_C/merged]
  reference:   [output/achilles/fsrich/nu_T2K_C.npz]
signal:
  mu_win: [0.0, inf]        # published binning starts at p_mu = 0
  cos_mu: null              # no backward muon cut -- the binning covers cos_mu down to -1
  cth: null                 # no forward cut either (it exists only to cut the TKI proton)
  require_proton: false     # ANY number of protons, including zero.  THE key difference.
  p_win: [0.0, inf]         # unused with require_proton false; permissive so it cannot bite
  proton_lead: global
  pi_win: null
  pion_id: none             # veto all pions
  veto_other_mesons: true   # "no other mesons in the final state"
  target: CH
observables:
  - {key: pmu,     label: '$p_\mu$ [MeV/c]',   linspace: [0.0, 5000.0, 26]}
  - {key: cos_mu,  label: '$\cos\theta_\mu$',  linspace: [-1.0, 1.0, 21]}
out_path: output/paper/t2k_cc0pi_ddxs.png
title: 'T2K CC0$\pi$ $d^2\sigma/dp_\mu d\cos\theta_\mu$ on CH'
