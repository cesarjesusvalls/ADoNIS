# T2K CC1pi+Np on a CH target (carbon + free hydrogen) -- the "non-pure target changes nothing" demo.
# Identical to t2k_cc1pi.yaml except signal.target: CH, which adds the reweightable free-H
# (nu_mu p -> mu- p pi+, RES-only) contribution -- central offset + its gradient -- to pn/dptt/dalphat,
# streamed from the nu_T2K_H bank (delta_alphaT undefined for free-H -> uniform, NUISANCE prescription).
render: multiobs
name: t2k_cc1pi_ch
inputs:
  adonis_bank: [nu_T2K_C/merged]
  reference:   [output/achilles/fsrich/nu_T2K_C.npz]
signal:
  mu_win: [250.0, 7000.0]
  p_win: [450.0, 1200.0]
  pi_win: [150.0, 1200.0]
  cth: cos70
  cos_mu: null
  pion_id: pip
  proton_lead: in_window
  target: CH
observables:
  - {key: pn,      label: '$p_N$ [MeV/c]',            edges: [0, 120, 240, 600, 1500]}
  - {key: dptt,    label: '$\delta p_{TT}$ [MeV/c]',  edges: [-700, -300, -100, 100, 300, 700]}
  - {key: dalphat, label: '$\delta\alpha_T$ [rad]',   edges: [0.0, 1.0471975512, 2.0943951024, pi]}
  - {key: ppi,     label: '$p_\pi$ [MeV/c]',          linspace: [150.0, 1200.0, 22],  fit: false}
  - {key: cos_pi,  label: '$\cos\theta_\pi$',         linspace: [0.3, 1.0, 15],       fit: false}
out_path: output/paper/fig08_t2k_cc1pi_ch.png
title: 'T2K CC1$\pi^+$ on CH ($^{12}$C + H)'
ratio_band: [0.9, 1.1]
ratio_ylim: [0.75, 1.25]
