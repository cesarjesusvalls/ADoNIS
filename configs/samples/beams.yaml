# Beam-scattering samples: pi+, proton and neutron on carbon.
#
# These are FSI-ONLY: a beam particle is fired at the nucleus and the cascade decides what comes out, so
# they constrain the FSI block and nothing else.  They enter Gate I and the sec4 engine as fixed-width
# blocks appended after the experiment samples, and their observable KEYS are what the dskeys ordering
# assertion checks against.
#
# This file exists because the same dict was hardcoded in two places -- gate1_multisample.py and the
# (now removed) sec3_gradients/build_multisample.py -- and the two had to be edited in step.  The block
# structure is fixed by beam_fisher.beam_jacobian, which returns `nbins` reaction bins followed by
# `nbins` of a second observable, so the two keys per beam are ordered and must stay that way.

nbins: 15          # per observable; beam_jacobian returns 2 x nbins rows per beam
syst: 0.05         # same fractional systematic as the experiment samples

beams:
  pip:
    observables: [pip_react, pip_abs]        # reaction, then absorption
  prot:
    observables: [prot_react, prot_pipro]    # reaction, then pion production
  neut:
    observables: [neut_react, neut_pipro]
