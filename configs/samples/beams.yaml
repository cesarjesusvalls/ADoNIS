# Beam-scattering samples: pi+, proton and neutron on carbon.
#
# FSI only: a beam particle is fired at the nucleus and the cascade decides what comes out, so these
# constrain the cascade parameters and nothing else.  They append to the Jacobian as fixed-width blocks
# after the experiment samples, and their observable keys are what the dskeys ordering check uses.
#
# The block structure is fixed by beam_jacobian, which returns `nbins` reaction bins followed by
# `nbins` of a second observable, so the two keys per beam are ordered and must stay that way.

nbins: 15          # per observable; beam_jacobian returns 2 x nbins rows per beam
syst: 0.05         # same fractional systematic as the experiment samples

beams:
  pip:
    observables: [pip_react, pip_abs]        # reaction, then absorption
  prot:
    observables: [prot_react, prot_pipro]    # reaction, then pion production
  neut:
    observables: [neut_react, neut_pipro]
