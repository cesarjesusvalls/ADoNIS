# MINERvA nu_mu CC 1pi+ on scintillator (CH), arXiv:2605.24224 -- dsigma/dT_pi.
#
# Signal (verbatim from the paper): "a numu CC interaction inside of the inner tracking volume, producing
# a single mu-, a single pi+, any number of baryons, and no other mesons in the final state", with
# W_exp < 1.4 GeV/c^2 to "isolate a primarily Delta(1232) resonance signal", plus the acceptance cuts
# 1.5 < p_mu < 20 GeV/c, theta_mu < 20 deg, and T_pi < 350 MeV.
#
# W_exp and Q2 use the paper's nucleon-at-rest reconstruction (Eqs. 1-3).  At truth level E_had = Enu-Emu
# exactly, so selection._q2_wexp evaluates them with the TRUE Enu -- no visible-energy convention needed.
#
# The RES axial block enters as r_ax = dipole(Q2; M_A_res) * res_axial_strength, so M_A_res sets its Q2
# shape and C5A its normalisation.  The two are separable only with Q2 lever arm, which is what a
# resonant sample binned in Q2 provides and a CC0pi sample does not.
# Bins: the 10 published T_pi bins; the paper also releases stat+syst covariances for them.
render: multiobs
name: minerva_cc1pip_tpi
inputs:
  adonis_bank: [nu_MINERvA_C/merged]
  h_bank:      [nu_MINERvA_H/merged]   # free-H (CH); NuMI flux, RES-only, no FSI
signal:
  mu_win: [1500.0, 20000.0]        # 1.5 < p_mu < 20 GeV/c
  cth: 0.9396926208                # theta_mu < 20 deg
  cos_mu: null
  pion_id: pip                     # exactly one pi+, no pi0/pi-
  veto_other_mesons: true          # "no other mesons"
  require_proton: false            # "any number of baryons"
  p_win: [0.0, 100000.0]           # unused for selection (require_proton false); needed for lead-proton obs
  pi_win: null                     # T_pi window is used instead of a momentum window
  tpi_win: [0.0, 350.0]            # T_pi < 350 MeV
  w_exp_max: 1400.0                # W_exp < 1.4 GeV/c^2
  target: CH
observables:
  - {key: tpi, label: '$T_\pi$ [MeV]',
     edges: [0, 20, 35, 50, 65, 80, 100, 125, 165, 200, 350]}
out_path: output/paper/minerva_cc1pip_tpi.png
title: 'MINERvA CC1$\pi^+$ on CH: $d\sigma/dT_\pi$'
