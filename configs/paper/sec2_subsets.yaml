# Section 3 (Fisher information per subset) -- WHICH bins go in each column of each figure.
#
# Everything sec3 plots is a ROW SLICE of one persisted Jacobian, so a "subset" is just a set of
# dataset keys (`dskeys` in the npz).  This file is the single place that names them, so changing the
# sample composition or the binning of the input npz is a CONFIG edit, not a code edit.
#
# Group entries accept three kinds of item, mixed freely:
#   * a literal dskey            ->  pmu
#   * a glob over dskeys         ->  mnv_*        (matches whatever MINERvA observables exist)
#   * a reference to an earlier group in the SAME axis  ->  <T2K>   (inherits its resolved keys)
# The reference form is what makes a cumulative ladder cheap: each rung is the previous rung plus one
# sample, with no repetition, so adding a sample means adding one line.
#
# Resolution is tolerant by design (see sec2_fisher/subsets.py): a pattern that matches nothing is
# reported and dropped, a group left with no keys is dropped as a column, and any dskey in the npz that
# NO group in an axis picks up is reported as `uncovered` -- so a newly added sample is never silently
# ignored.

# Default input under output/altgen/ (override: CLI arg or ADONIS_SEC2_NPZ).  An axis MAY set its own
# `npz:`, but none do now.  This is the SAME multi-sample npz section 2 plots, so every sec3 figure uses
# the SAME samples + signal defs as sec2: T2K keep-filtered to its 7 STV + CC0pi-muon observables,
# MINERvA (STV + 1D pT/p||), (e,e'), and the pi+/p/n beams.
npz: multisample_carbon
fit_cut: 0.5                   # a knob is FIT when shrinkage sigma_post/sigma_prior < this

axes:

  # ---- What does each PROBE TYPE buy you?  (neutrino / electron / hadron beams) ------------------ #
  # The ONLY axis kept: it makes constraints_per_subset, the paper's "constraining power per probe"
  # figure.  (The per-sample / cumulative-ladder axes and the failure-mode + degeneracy reference
  # figures were pruned -- they are not paper figures.)
  by_probe:
    figure: constraints_per_subset       # renamed 2026-08-14 (was sec2_shrinkage_subsets, then the
    #                                      misspelled constrains_per_subset)
    title: Gate I per probe type
    marginalized_only: true              # single panel: what the joint fit delivers (no raw/degeneracy panel)
    groups:                              # all samples, grouped by beam particle (uses the default npz)
      # dskeys are now namespaced `sample:obs` (AnaSample/SampleSet), so a probe is a clean glob over samples
      nu:    {label: "$\\nu$\nT2K + MINERvA",     keys: ["t2k_*", "minerva_*"]}
      ebeam: {label: "$e$ beam\n$(e,e')$",        keys: ["ee_*"]}
      hadr:  {label: "hadron beam\n$\\pi^+,p,n$", keys: ["pip_*", "prot_*", "neut_*"]}
      all:   {label: "ALL",                       keys: ["<nu>", "<ebeam>", "<hadr>"]}   # every sample at once
