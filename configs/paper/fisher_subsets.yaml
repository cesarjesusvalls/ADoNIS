# Fisher information per subset: which bins go in each column of the figure.
#
# Every column is a row slice of one persisted Jacobian, so a "subset" is just a set of dataset keys
# (`dskeys` in the npz).  This file is the single place that names them, so changing the sample
# composition or the binning is a config edit, not a code edit.
#
# Group entries accept three kinds of item, mixed freely:
#   * a literal dskey            ->  pmu
#   * a glob over dskeys         ->  mnv_*        (matches whatever MINERvA observables exist)
#   * a reference to an earlier group in the SAME axis  ->  <T2K>   (inherits its resolved keys)
# The reference form is what makes a cumulative ladder cheap: each rung is the previous rung plus one
# sample, with no repetition, so adding a sample means adding one line.
#
# Resolution is tolerant by design: a pattern matching nothing is reported and dropped, a group left
# with no keys is dropped as a column, and any dskey no group picks up is reported as `uncovered`, so
# a newly added sample is never silently ignored.

# The input npz under output/results/; an axis may override it with its own `npz:`.  It is the same
# multi-sample Jacobian the per-bin gradient figure uses, so the two show the same samples and signal
# definitions: T2K, MINERvA, (e,e'), and the pi+/p/n beams.
npz: multisample_carbon
fit_cut: 0.5                   # a knob is FIT when shrinkage sigma_post/sigma_prior < this

axes:

  # What each probe type constrains: neutrino, electron, hadron beams.
  by_probe:
    figure: constraints_per_subset
    title: the constrained set per probe type
    marginalized_only: true              # single panel: what the joint fit delivers (no raw/degeneracy panel)
    groups:                              # all samples, grouped by beam particle (uses the default npz)
      # dskeys are now namespaced `sample:obs` (AnaSample/SampleSet), so a probe is a clean glob over samples
      nu:    {label: "$\\nu$\nT2K + MINERvA",     keys: ["t2k_*", "minerva_*"]}
      ebeam: {label: "$e$ beam\n$(e,e')$",        keys: ["ee_*"]}
      hadr:  {label: "hadron beam\n$\\pi^+,p,n$", keys: ["pip_*", "prot_*", "neut_*"]}
      all:   {label: "ALL",                       keys: ["<nu>", "<ebeam>", "<hadr>"]}   # every sample at once
