# CC0pi exactly 1 ejected proton on Ar -- LEPTON kinematics (Q2, p_mu, cos_mu).
# Run: python -u scripts/adonis_analyze.py configs/ana_cc0pi_1p_ar_lep.yaml
name: t2k_cc0pi_1p_ar_lep
inputs:
  adonis_qe:  [data/oracle/t2k_cc0pi_engine_rich_ar.npz]
  adonis_res: [data/oracle/t2k_cc1pi_engine_rich_ar.npz]
  reference:  [data/oracle/t2k_cc1pi_rich_ach_FSI_Ar.npz]
signal:
  mu_win: [250.0, inf]
  cos_mu: -0.6
  p_win:  [450.0, 1000.0]
  cth: 0.4
  pi_win: null
  proton_lead: global
  pion_id: none
  require_proton: true
  n_ejected: 1
  eject_thresh: 250.0
  target: carbon
observables:
  - {key: Q2,     label: "$Q^2$ [GeV$^2$]",      linspace: [0, 1.4, 16]}
  - {key: p_mu,   label: "$p_\\mu$ [MeV]",       linspace: [0, 2000, 16]}
  - {key: cos_mu, label: "$\\cos\\theta_\\mu$",  linspace: [-0.6, 1.0, 16]}
out_path: paper_figures/cc0pi_1proton_argon_lepton.png
title: "CC0$\\pi$ 1 ejected proton ($^{40}$Ar): lepton kinematics"
ratio_ylim: [0.6, 1.4]
carbon_only: true
