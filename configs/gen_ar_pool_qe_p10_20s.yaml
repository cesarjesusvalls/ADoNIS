# Pool QE Ar CC0pi, P=10 (lossless capacity), 20 seeds -> high-stats topology residuals.
# Run: python -u scripts/adonis_generate.py configs/gen_ar_pool_qe_p10_20s.yaml
name: t2k_ar_pool_qe_p10_20s
material: Ar
n_per_seed: 30000
n_seeds: 20
channels: [qe]
cascade: {P: 10, max_gen: 3, n_recoil: 2, step: 0.04, max_steps: 600,
          cylinder: true, nn_inelastic: true, mprot: 4, engine: pool}
tracking: {enabled: false, steps: false}
out_dir: data/oracle
tag: _arpool20
