# Pool RES Ar CC1pi, P=10, 20 seeds.  RES primary pion runs as a gen-0 PION stack slot; its scatter
# recoils / absorption protons / created pions spawn natively.  Pairs with t2k_cc0pi_engine_rich_arpool20.
# Run: python -u scripts/adonis_generate.py configs/gen_ar_pool_res_20s.yaml
name: t2k_ar_pool_res_20s
material: Ar
n_per_seed: 30000
n_seeds: 20
channels: [res]
cascade: {P: 10, max_gen: 3, n_recoil: 2, step: 0.04, max_steps: 600,
          cylinder: true, nn_inelastic: true, mprot: 4, engine: pool}
tracking: {enabled: false, steps: false}
out_dir: data/oracle
tag: _arpool20
