# Paper appendix fig:MINERvA_extras — MINERvA CC0pi additional differential cross sections
# (MINERvA:2018hba), ADoNIS vs ACHILLES on 12C.  Same signal as fig09; the paper shows six further
# observables: proton p/theta, muon p/theta, and the two transverse-imbalance angles.
# No new generation: this is the SAME nu_MINERvA_C bank fig09 already uses.
name: figA1_minerva_extras
inputs:
  adonis_bank: [output/paper_banks_p4/nu_MINERvA_C/merged]
  reference:   [output/achilles/fsrich/nu_MINERvA_C.npz]
signal:      # identical to fig09 (MINERvA CC0pi acceptance)
  mu_win: [1500.0, 10000.0]
  cos_mu: 0.9396926207859084   # cos(20 deg) -- MINERvA forward-muon acceptance
  p_win: [450.0, 1200.0]
  cth: cos70
  pi_win: null
  pion_id: none
  proton_lead: global
observables:   # binned over the acceptance windows the signal itself defines
  - {key: lp_p,   label: '$p_p$ [MeV/c]',            linspace: [450.0, 1200.0, 16]}
  - {key: th_lp,  label: '$\theta_p$ [deg]',        linspace: [0.0, 70.0, 15]}
  - {key: pmu,    label: '$p_\mu$ [MeV/c]',          linspace: [1500.0, 8000.0, 14]}
  - {key: th_mu,  label: '$\theta_\mu$ [deg]',      linspace: [0.0, 20.0, 15]}
  - {key: dpt,    label: '$\delta p_T$ [MeV/c]',     linspace: [0.0, 800.0, 21]}
  - {key: dphit,  label: '$\delta\phi_T$ [rad]',     linspace: [0.0, pi, 21]}
out_path: output/paper/figA1_minerva_extras.png
title: 'MINERvA CC0$\pi$ --- additional differential cross sections on $^{12}$C'
ratio_band: [0.9, 1.1]
ratio_ylim: [0.75, 1.25]
