# Paper Fig 9 — MINERvA CC0pi TKI (Lu et al. / MINERvA:2018hba), ADoNIS vs ACHILLES on 12C, <Enu>~3 GeV.
# Paper highlights delta_alphaT and p_n; shown first.
name: fig09_minerva_cc0pi
inputs:
  adonis_bank: [output/paper_banks_p4/nu_MINERvA_C/merged]
  reference:   [output/achilles/fsrich/nu_MINERvA_C.npz]
signal:      # CC0pi: mu 1500-10000 & cos>cos20 ; global leading p 450-1200 & cos>cos70 ; zero mesons
  mu_win: [1500.0, 10000.0]
  cos_mu: 0.9396926207859084   # cos(20 deg) -- MINERvA forward-muon acceptance
  p_win: [450.0, 1200.0]
  cth: cos70
  pi_win: null
  pion_id: none
  proton_lead: global
observables:
  - {key: dalphat, label: '$\delta\alpha_T$ [rad]', linspace: [0.0, pi, 21]}
  - {key: pn,      label: '$p_n$ [MeV/c]',          linspace: [0.0, 800.0, 21]}
  - {key: dpt,     label: '$\delta p_T$ [MeV/c]',   linspace: [0.0, 800.0, 21]}
out_path: output/paper/fig09_minerva_cc0pi.png
title: 'MINERvA CC0$\pi$ TKI on $^{12}$C'
ratio_band: [0.9, 1.1]
ratio_ylim: [0.75, 1.25]
