# Buffer study A (P=6/g3/nr2/mp4): CC1pi engine vs ACHILLES. Same selection as ana_cc1pi.yaml.
# Run: python -u scripts/adonis_analyze.py configs/ana_cc1pi_p6g3.yaml
name: t2k_cc1pi_p6g3
inputs:
  adonis_res: [data/oracle/t2k_cc1pi_engine_rich_p6g3.npz]
  adonis_qe:  [data/oracle/t2k_cc0pi_engine_rich_p6g3.npz]
  reference:  [data/oracle/t2k_cc1pi_rich_ach_FSI.npz]
signal:
  mu_win: [250.0, 7000.0]
  pi_win: [150.0, 1200.0]
  p_win:  [450.0, 1200.0]
  cth: cos70
  proton_lead: in_window
  proton_count: ge1
  require_proton: true
  pion_id: pip
  count_recoil_neutron: false
  target: carbon
  W_conv: vertex
observables:
  - {key: pn,      label: "$p_N$",            edges: [0, 120, 240, 600, 1500]}
  - {key: dptt,    label: "$\\delta p_{TT}$", edges: [-700, -300, -100, 100, 300, 700]}
  - {key: dalphat, label: "$\\delta\\alpha_T$", linspace: [0, pi, 7]}
  - {key: W,       label: "$W$",              linspace: [1080, 1700, 13]}
  - {key: Q2,      label: "$Q^2$",            linspace: [0, 1.5, 13]}
  - {key: pi_p,    label: "$p_\\pi$",         linspace: [150, 1200, 13]}
  - {key: lp_p,    label: "lead $p_p$",       linspace: [450, 1200, 13]}
data: {enabled: false}
out_path: paper_figures/cc1pi_ENGINE_p6g3.png
title: "CC1$\\pi^+$Np P=6/g3/nr2 vs ACHILLES (carbon)"
ratio_ylim: [0.5, 1.6]
carbon_only: false
