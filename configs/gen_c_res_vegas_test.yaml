# Small end-to-end Vegas test: fast warm-up (with progress bar) + 2 short seeds -> bank.
# Confirms the full chain (warm-up -> frozen grid sidecar -> cascade bank) before any big run.
name: t2k_c_res_vegas_test
material: C
n_per_seed: 8000
n_seeds: 2
channels: [res]
cascade: {P: 10, max_gen: 3, n_recoil: 2, step: 0.04, max_steps: 600,
          cylinder: true, nn_inelastic: true, mprot: 4, engine: pool}
vegas: {enabled: true, nbins: 50, warmup_iters: 3, warmup_n: 15000}
tracking: {enabled: false, steps: false}
out_dir: data/oracle
tag: _cvtest
