# PRE-FSI T2K CC1pi+Np: ADoNIS RES primary (no cascade) vs ACHILLES no-FSI bank.  Same signal def.
# Run: python -u scripts/adonis_analyze.py configs/ana_cc1pi_prefsi.yaml
name: t2k_cc1pi_prefsi
inputs:
  adonis_res: [data/oracle/t2k_cc1pi_engine_rich_nofsi.npz]
  reference:  [data/oracle/t2k_cc1pi_rich_ach_nofsi.npz]
signal:
  mu_win: [250.0, 7000.0]
  pi_win: [150.0, 1200.0]
  p_win:  [450.0, 1200.0]
  cth: cos70
  proton_lead: in_window
  proton_count: ge1
  require_proton: true
  pion_id: pip
  target: carbon
  W_conv: vertex
observables:
  - {key: pn,      label: "$p_N$",            edges: [0, 120, 240, 600, 1500]}
  - {key: dptt,    label: "$\\delta p_{TT}$", edges: [-700, -300, -100, 100, 300, 700]}
  - {key: dalphat, label: "$\\delta\\alpha_T$", linspace: [0, pi, 7]}
  - {key: W,       label: "$W$",              linspace: [1080, 1700, 13]}
  - {key: Q2,      label: "$Q^2$",            linspace: [0, 1.5, 13]}
  - {key: pi_p,    label: "$p_\\pi$",         linspace: [150, 1200, 13]}
  - {key: lp_p,    label: "lead $p_p$",       linspace: [450, 1200, 13]}
out_path: paper_figures/cc1pi_PREFSI_compare.png
title: "T2K CC1$\\pi^+$Np PRE-FSI (RES primary) vs ACHILLES no-FSI"
ratio_ylim: [0.5, 1.6]
carbon_only: false
