# Buffer study B (P=12/g6/nr4/mp6): CC0pi engine vs ACHILLES. Same selection as ana_cc0pi.yaml.
# Run: python -u scripts/adonis_analyze.py configs/ana_cc0pi_p12g6.yaml
name: t2k_cc0pi_p12g6
inputs:
  adonis_qe:  [data/oracle/t2k_cc0pi_engine_rich_p12g6.npz]
  adonis_res: [data/oracle/t2k_cc1pi_engine_rich_p12g6.npz]
  reference:  [data/oracle/t2k_cc1pi_rich_ach_FSI.npz]
signal:
  mu_win: [250.0, inf]
  cos_mu: -0.6
  p_win:  [450.0, 1000.0]
  cth: 0.4
  pi_win: null
  proton_lead: global
  pion_id: none
  proton_count: ge1
  require_proton: true
  target: carbon
observables:
  - {key: dpt,     label: "$\\delta p_T$ [MeV]",       linspace: [0, 800, 21]}
  - {key: dalphat, label: "$\\delta\\alpha_T$ [rad]",  linspace: [0, pi, 21]}
  - {key: Q2,      label: "$Q^2$ [GeV$^2$]",           linspace: [0, 1.4, 21]}
  - {key: W,       label: "vertex $W$ [MeV]",          linspace: [938, 1400, 21]}
  - {key: p_mu,    label: "$p_\\mu$ [MeV]",            linspace: [0, 2000, 21]}
  - {key: cos_mu,  label: "$\\cos\\theta_\\mu$",       linspace: [-0.6, 1.0, 21]}
  - {key: lp_p,    label: "lead $p_p$ [MeV]",          linspace: [450, 1000, 21]}
data: {enabled: false}
out_path: paper_figures/cc0pi_ENGINE_p12g6.png
title: "T2K CC0$\\pi$-Np (12C) P=12/g6/nr4 vs ACHILLES"
ratio_ylim: [0.6, 1.4]
carbon_only: true
