# CC0pi-Np on Ar, SAME as ana_cc0pi_ar.yaml but with NO proton-momentum acceptance window
# (p_win = [0, inf]). The cos-theta_p > 0.4 angle cut is kept; leading proton = global max-|p|.
# lp_p axis widened to show the newly-included low-momentum protons.
# Run: python -u scripts/adonis_analyze.py configs/ana_cc0pi_ar_nopcut.yaml
name: t2k_cc0pi_ar_nopcut
inputs:
  adonis_qe:  [data/oracle/t2k_cc0pi_engine_rich_ar.npz]
  adonis_res: [data/oracle/t2k_cc1pi_engine_rich_ar.npz]
  reference:  [data/oracle/t2k_cc1pi_rich_ach_FSI_Ar.npz]
signal:
  mu_win: [250.0, inf]
  cos_mu: -0.6
  p_win:  [0.0, inf]
  cth: 0.4
  pi_win: null
  proton_lead: global
  pion_id: none
  proton_count: ge1
  require_proton: true
  target: carbon
observables:
  - {key: dpt,     label: "$\\delta p_T$ [MeV]",       linspace: [0, 800, 21]}
  - {key: dalphat, label: "$\\delta\\alpha_T$ [rad]",  linspace: [0, pi, 21]}
  - {key: Q2,      label: "$Q^2$ [GeV$^2$]",           linspace: [0, 1.4, 21]}
  - {key: W,       label: "vertex $W$ [MeV]",          linspace: [938, 1400, 21]}
  - {key: p_mu,    label: "$p_\\mu$ [MeV]",            linspace: [0, 2000, 21]}
  - {key: cos_mu,  label: "$\\cos\\theta_\\mu$",       linspace: [-0.6, 1.0, 21]}
  - {key: lp_p,    label: "lead $p_p$ [MeV]",          linspace: [0, 1500, 21]}
data: {enabled: false}
out_path: paper_figures/cc0pi_ENGINE_argon_nopcut.png
title: "T2K CC0$\\pi$-Np ($^{40}$Ar), NO proton-p cut: ENGINE QE+RES-absorbed vs ACHILLES"
ratio_ylim: [0.6, 1.4]
carbon_only: false
