# Carbon RES-only, 20 seeds, SAME buffers as the salvaged 42-seed QE _cv bank. Pairs with
# t2k_cc0pi_engine_rich_cv.npz for the carbon comparison. Run: python -u scripts/adonis_generate.py configs/gen_c_res.yaml
name: t2k_c_res
material: C
n_per_seed: 30000
n_seeds: 20
channels: [res]
cascade: {P: 8, max_gen: 4, n_recoil: 3, step: 0.04, max_steps: 260,
          cylinder: true, nn_inelastic: true, mprot: 6}
tracking: {enabled: false, steps: false}
out_dir: data/oracle
tag: _cv
