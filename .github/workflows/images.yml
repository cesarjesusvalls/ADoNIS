name: images

# Build and publish the ACHILLES reference images, so a reproduction needs `docker pull` and never a
# local ACHILLES build.  Run manually; the images change only when the generator or the patch does.
on:
  workflow_dispatch:
    inputs:
      achilles_repo:
        description: "ACHILLES source repository"
        default: "AchillesGen/Achilles"
      achilles_ref:
        description: "commit, tag or branch to build"
        default: "91b5ea5adfe13a83a30b6365664053af11414dbc"
      push:
        description: "push to ghcr.io (otherwise build only)"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        image: [cascade, fullcascade]
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the ACHILLES source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.achilles_repo }}
          ref: ${{ inputs.achilles_ref }}
          path: achilles-src
          token: ${{ secrets.ACHILLES_SRC_TOKEN || github.token }}

      - name: Stage the build context
        run: cp docker/patch_cascade_registry.py achilles-src/

      - uses: docker/login-action@v3
        if: ${{ inputs.push }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: achilles-src
          file: docker/Dockerfile.${{ matrix.image }}
          push: ${{ inputs.push }}
          tags: ghcr.io/${{ github.repository_owner }}/achilles:${{ matrix.image }}

      - name: Record the digest
        if: ${{ inputs.push }}
        run: |
          echo "ghcr.io/${{ github.repository_owner }}/achilles:${{ matrix.image }}"
          echo "digest: ${{ steps.build.outputs.digest }}"
