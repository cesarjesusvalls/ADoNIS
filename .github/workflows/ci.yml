name: CI

# The pytest suite, against ACHILLES tables extracted from the published reference image.
# The physics suite: minutes-long, so it does not run on every push.  workflows/checks.yml is the
# per-push gate.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/cesarjesusvalls/achilles:oracle
  # bump the suffix whenever the oracle image is rebuilt, to refresh the table cache
  DATA_CACHE_KEY: achilles-data-oracle-a4f761ea-mb-ar40
  ACHILLES_DATA: ${{ github.workspace }}/achilles_data
  ADONIS_CI_FAST: "1"
  # keep the float64 JAX folds from spiking memory on a ~7 GB hosted runner
  JAX_PLATFORMS: cpu
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"
  MALLOC_ARENA_MAX: "2"

jobs:
  test-and-figures:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[plots,dev]"

      - name: Cache ACHILLES data tables
        id: dcache
        uses: actions/cache@v4
        with:
          path: achilles_data
          key: ${{ env.DATA_CACHE_KEY }}

      - name: Extract ACHILLES data tables from image
        if: steps.dcache.outputs.cache-hit != 'true'
        run: scripts/fetch_achilles_data.sh "$ACHILLES_DATA"

      - name: Runner resources (diagnostic)
        run: |
          echo "cores: $(nproc)"
          free -h || cat /proc/meminfo | head -3
          df -h / | tail -1
          python -c "import jax, jaxlib; print('jax', jax.__version__, 'jaxlib', jaxlib.__version__); print('devices', jax.devices())"

      - name: Per-module self-tests (closure + reweight)
        run: |
          set -o pipefail
          # Run each test file in its OWN process. These modules do heavy float64 JAX
          # work at IMPORT time, so collecting them all in one process stacks every
          # file's memory and OOM-kills the 7.8 GB runner during collection. Isolating
          # per file bounds peak memory to a single file; we log `free -h` after each
          # and keep going on failure so pytest.log captures the full picture.
          rc=0
          : > pytest.log
          for f in tests/test_*.py; do
            echo "::group::$f"
            python -m pytest "$f" -v -ra --durations=10 2>&1 | tee -a pytest.log
            code=$?   # pipefail -> pytest's exit code; 5 = "no tests collected" (OK)
            [ $code -eq 0 ] || [ $code -eq 5 ] || rc=1
            echo "--- free after $f (pytest exit $code) ---" | tee -a pytest.log
            free -h | tee -a pytest.log
            echo "::endgroup::"
          done
          exit $rc

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest.log
