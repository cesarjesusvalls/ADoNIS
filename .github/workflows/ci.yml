name: CI

# Fast PR/push gate: per-module closure + oracle self-tests, and the verification
# figures.  The ACHILLES data tables (DCC amplitudes + spectral function) are
# extracted from the published oracle image so the model side matches the oracle;
# the oracle npz itself is fetched from the `oracle-data` release if it exists
# (otherwise the oracle gates skip).  See .github/workflows/oracle.yml for the
# image-backed oracle regeneration.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/cesarjesusvalls/achilles:oracle
  # bump the suffix whenever the oracle image is rebuilt, to refresh the table cache
  DATA_CACHE_KEY: achilles-data-oracle-a4f761ea-mb-ar40
  ACHILLES_DATA: ${{ github.workspace }}/achilles_data
  ADONIS_CI_FAST: "1"
  # keep the float64 JAX folds from spiking memory on a ~7 GB hosted runner
  JAX_PLATFORMS: cpu
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"
  MALLOC_ARENA_MAX: "2"

jobs:
  test-and-figures:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Cache ACHILLES data tables
        id: dcache
        uses: actions/cache@v4
        with:
          path: achilles_data
          key: ${{ env.DATA_CACHE_KEY }}

      - name: Extract ACHILLES data tables from image
        if: steps.dcache.outputs.cache-hit != 'true'
        run: |
          docker pull "$IMAGE"
          cid=$(docker create "$IMAGE")
          mkdir -p achilles_data/Spectral_Functions
          docker cp "$cid:/achilles/data/dcc_EW.dat" achilles_data/dcc_EW.dat
          docker cp "$cid:/achilles/data/Spectral_Functions/pke12p_tot.data" achilles_data/Spectral_Functions/pke12p_tot.data
          docker cp "$cid:/achilles/data/Spectral_Functions/pke40p_tot.data" achilles_data/Spectral_Functions/pke40p_tot.data
          docker cp "$cid:/achilles/data/Spectral_Functions/pke40n_tot.data" achilles_data/Spectral_Functions/pke40n_tot.data
          mkdir -p achilles_data/MesonBaryonAmplitudes
          docker cp "$cid:/achilles/data/MesonBaryonAmplitudes/ANL" \
                    achilles_data/MesonBaryonAmplitudes/ANL
          docker rm "$cid"
          ls -la achilles_data achilles_data/Spectral_Functions

      - name: Runner resources (diagnostic)
        run: |
          echo "cores: $(nproc)"
          free -h || cat /proc/meminfo | head -3
          df -h / | tail -1
          python -c "import jax, jaxlib; print('jax', jax.__version__, 'jaxlib', jaxlib.__version__); print('devices', jax.devices())"

      - name: Fetch oracle data (if published)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/oracle
          if gh release download oracle-data -p oracle_finalstate.npz -D data/oracle/ 2>/dev/null; then
            echo "fetched oracle_finalstate.npz from the oracle-data release"
          else
            echo "no oracle-data release yet -> oracle gates will skip"
          fi

      - name: Per-module self-tests (closure + oracle)
        run: |
          set -o pipefail
          # Run each test file in its OWN process. These modules do heavy float64 JAX
          # work at IMPORT time, so collecting them all in one process stacks every
          # file's memory and OOM-kills the 7.8 GB runner during collection. Isolating
          # per file bounds peak memory to a single file; we log `free -h` after each
          # and keep going on failure so pytest.log captures the full picture.
          rc=0
          : > pytest.log
          for f in tests/test_*.py; do
            echo "::group::$f"
            python -m pytest "$f" -v -ra --durations=10 2>&1 | tee -a pytest.log
            code=$?   # pipefail -> pytest's exit code; 5 = "no tests collected" (OK)
            [ $code -eq 0 ] || [ $code -eq 5 ] || rc=1
            echo "--- free after $f (pytest exit $code) ---" | tee -a pytest.log
            free -h | tee -a pytest.log
            echo "::endgroup::"
          done
          exit $rc

      - name: Verification figures (reduced statistics)
        run: |
          ADONIS_DIFF_N=15000 python scripts/make_diff_figures.py
          ADONIS_NDATA=80000 ADONIS_NMODEL=30000 ADONIS_DATA_CHUNK=40000 ADONIS_ITERS=80 \
            python scripts/make_ma_fit.py
          if [ -f data/oracle/oracle_finalstate.npz ]; then
            # small per-chunk n: the angle-integrated fold's grid*n intermediate is the
            # memory hog (same reason test_fold_fs chunks); 8k*15 = 120k total, low peak
            FS_CHUNK=8000 FS_NCHUNK=15 python scripts/validate_final_state.py
          else
            echo "skipping final-state oracle figure (no oracle data)"
          fi

      - name: Upload figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: figures
          path: figures/

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest.log
