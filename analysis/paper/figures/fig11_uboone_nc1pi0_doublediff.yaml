# Paper fig:NCpi0Xpdoublediff -- MicroBooNE NC 1pi0 Xp DOUBLE-differential on 40Ar, BNB flux:
# d2sigma/dcos(theta_pi0) dp_pi0, shown as p_pi0 spectra in slices of cos(theta_pi0).
# ADoNIS vs ACHILLES.  NO DATA OVERLAY.
#
# This is the figure that forced row-wrapping into workflow.plotting.make_figure (it was 1xN only,
# which is also why figA1 renders wider than the page).  max_cols wraps the slices onto rows.
name: fig11_uboone_nc1pi0_doublediff
inputs:
  adonis_bank: [output/nc_uBooNE_Ar/merged]   # jobs/merge_bank.py --parts output/nc_uBooNE_Ar --out .../merged
  # ONE combined file, NOT the four shards listed separately: analyze._merge CONCATENATES its
  # references, which is right for different samples but wrong for independent shards of the SAME
  # beam -- it would report 4x the cross section (measured: ACH/ADO = 4.015).
  # jobs/combine_fsrich.py sets weight_to_nb = 1/N, which is the correct average.
  reference:   [output/achilles/fsrich/nc_uBooNE_Ar.npz]
signal:
  pion_id: pi0
  pi_win: [0.0, 2000.0]
  cth: -1.0
  mu_win: [0.0, inf]
  p_win: [0.0, inf]
  proton_lead: global
  proton_count: ge1
observables:   # p_pi0 in cos(theta_pi0) slices -- the slicing is applied by the fig11 driver
  - {key: p_pi0, label: '$p_{\pi^0}$ [MeV/c]', linspace: [0.0, 1000.0, 21]}
out_path: output/paper/fig11_uboone_nc1pi0_doublediff.png
title: 'MicroBooNE NC 1$\pi^0$ X$p$ --- $d^2\sigma/d\cos\theta_{\pi^0}\,dp_{\pi^0}$ on $^{40}$Ar'
ratio_band: [0.9, 1.1]
ratio_ylim: [0.75, 1.25]

# --- figure-orchestration (analysis/paper/figures entry): fig11 is a DRIVER (slices one observable) ---
render: analysis.paper.sec1_validation.fig11_nc_doublediff   # module with render(spec); loads THIS file's selection
params:                                                       # were fig11's argparse defaults
  slices: 4
  n_bins: 16
  max_cols: 2
